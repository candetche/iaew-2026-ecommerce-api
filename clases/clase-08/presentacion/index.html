table{width:100%;border-collapse:collapse;margin-bottom:8px}th{text-align:left;background:#d9e8ef}th,td{padding:8px 11px;border-bottom:1px solid #c9d8e2;font-size:clamp(14px,1.3vw,18px)}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;overflow-wrap:anywhere}.schema{padding:15px 19px;border-radius:10px;background:#111e2d;color:#e5f8ff;font:clamp(14px,1.45vw,19px)/1.4 ui-monospace,monospace;white-space:pre-wrap}.tag{display:inline-block;border:1px solid #4c726e;color:#8ce7d3;padding:9px 13px;border-radius:6px;margin-top:10px;font-size:13px;letter-spacing:.05em}

<script>
const slides=[
{theme:"dark",block:"0–12 min · continuidad",title:"IA aplicada a integraciones<br>y MCP",body:'<p class="subtitle">Del pedido que ya sabemos crear, proteger, procesar y observar a una operación propuesta desde un asistente.</p><div class="tag">CLASE 08 · 19/10/2026 · IAEW 2026</div>',notes:""},
{block:"0–12 min · continuidad",title:"La historia empieza con un pedido",body:'<div class="flow"><b>Operador</b><i>→</i><b>API de pedidos</b><i>→</i><b>Pedido persistido</b></div><div class="grid"><article><h3>Lo que quiere hacer</h3><p>Consultar un pedido del laboratorio y, si corresponde, solicitar su confirmación.</p></article><article><h3>La pregunta de hoy</h3><p>¿Qué hace falta para que un asistente ayude sin convertirse en dueño de la API ni de sus permisos?</p></article></div>',notes:""},
{compact:true,block:"0–12 min · continuidad",title:"Cada clase resolvió una necesidad",body:'<div class="grid three"><article><h3>Clase 02 · API + persistencia</h3><p>Crear pedidos y conservar su estado.<br><strong>Abre:</strong> ¿quién puede actuar?</p></article><article><h3>Clase 03 · Seguridad</h3><p>Identificar al cliente y limitar operaciones.<br><strong>Abre:</strong> ¿y si intervienen otros componentes?</p></article><article><h3>Clase 04 · Asincronía</h3><p>Conectar API, broker y worker.<br><strong>Abre:</strong> ¿cómo tratamos fallas y duplicados?</p></article><article><h3>Clase 05 · Resiliencia</h3><p>Tratar fallas, duplicados e idempotencia.<br><strong>Abre:</strong> ¿cómo conoce otro consumidor el contrato?</p></article><article><h3>Clase 06 · Documentación</h3><p>Hacer explícitos contratos y decisiones.<br><strong>Abre:</strong> ¿qué ocurrió realmente?</p></article><article><h3>Clase 07 · Observabilidad</h3><p>Reconstruir lo ocurrido con señales.<br><strong>Abre:</strong> ¿cómo usa el sistema un asistente?</p></article></div>',notes:""},
{block:"0–12 min · continuidad",title:"Una API responde; el sistema integra",body:'<div class="flow"><b>Cliente HTTP</b><i>→</i><b>API + MongoDB</b><i>→</i><b>RabbitMQ</b><i>→</i><b>Worker</b></div><div class="call">La API responde al cliente; después el worker procesa el evento. No son una sola llamada ni una sola responsabilidad.</div><p style="margin-top:14px">¿Cómo falla una entrega? ¿Cómo evitamos repetir el efecto? ¿Cómo comprobamos qué pasó?</p>',notes:""},
{block:"0–12 min · continuidad",title:"El contrato y las señales nos dan contexto",body:'<div class="grid"><article><h3>Clase 06 · documentación</h3><p>OpenAPI, evento y decisiones describen qué debería ocurrir.</p></article><article><h3>Clase 07 · observabilidad</h3><p>Logs, métricas, trazas y correlación ayudan a saber qué ocurrió.</p></article></div><div class="call" style="margin-top:16px">Evidencia registrada en Clase 07: una traza compartida API–worker y logs recuperados por <code>trace_id</code>.</div>',notes:""},
{block:"0–12 min · continuidad",title:"La nueva pregunta: ¿quién decide?",body:'<div class="grid three"><article><h3>¿Qué ya tenemos?</h3><p>API, identidad, contratos, eventos y observabilidad.</p></article><article><h3>¿Qué falta?</h3><p>Traducir una intención a una operación estructurada.</p></article><article><h3>¿Quién autoriza?</h3><p>La política de la aplicación y la persona cuando corresponda.</p></article></div><div class="call" style="margin-top:15px">El lenguaje natural no concede permisos. MCP no reemplaza la API.</div>',notes:""},
{block:"0–12 min · continuidad",title:"Ruta de 120 minutos",body:'<table><tr><th>Bloque</th><th>Duración</th></tr><tr><td>Continuidad, necesidad y objetivo</td><td>12 min</td></tr><tr><td>Fundamentos IA, contexto, límites y RAG</td><td>20 min</td></tr><tr><td>Integración directa, tools, resources y MCP</td><td>15 min</td></tr><tr><td>Demo, seguridad y auditoría</td><td>15 min</td></tr><tr><td>Práctica individual guiada</td><td>45 min</td></tr><tr><td>Evidencias y testing</td><td>8 min</td></tr><tr><td>Profundización opcional</td><td>5 min</td></tr></table><div class="call">12 + 20 + 15 + 15 + 45 + 8 + 5 = 120 minutos.</div>',notes:""},
{block:"12–32 min · fundamentos IA",title:"Un modelo de lenguaje (LLM) produce una salida probable",body:'<div class="grid three"><article><h3>Modelo de lenguaje</h3><p>Parámetros aprendidos que generan una continuación a partir de una entrada.</p></article><article><h3>Inferencia</h3><p>Ejecución del modelo para producir una salida ante el contexto recibido.</p></article><article><h3>Contexto</h3><p>Instrucciones, mensajes y datos disponibles en ese turno, con límite finito.</p></article></div><div class="call" style="margin-top:15px">Una respuesta fluida puede ser incorrecta; el modelo no ve automáticamente el estado actual del pedido.</div>',notes:""},
{block:"12–32 min · fundamentos IA",title:"Texto generado no es dato verificado",body:'<div class="grid"><article><h3>Sin consulta</h3><p>«El pedido probablemente está pendiente.»</p><p><strong>Es una conjetura.</strong></p></article><article><h3>Con consulta autorizada</h3><p><code>consultar_estado_pedido(pedidoId)</code><br>Resultado: <code>{ pedidoId, estado: "pendiente" }</code></p><p><strong>Es una respuesta basada en la API.</strong></p></article></div><div class="call" style="margin-top:14px">El conocimiento del modelo no acredita el estado actual ni la autorización.</div>',notes:""},
{block:"12–32 min · fundamentos IA",title:"Tool calling: una propuesta estructurada",body:'<div class="steps"><div><b>1</b>La aplicación describe herramientas disponibles y sus schemas.</div><div><b>2</b>El modelo propone un nombre de herramienta y argumentos.</div><div><b>3</b>El host valida la propuesta y aplica política.</div><div><b>4</b>El cliente ejecuta; el resultado vuelve al modelo para formular la respuesta.</div></div><div class="call" style="margin-top:13px">La propuesta no es una ejecución: la aplicación controla el paso de la herramienta.</div>',notes:""},
{block:"12–32 min · fundamentos IA",title:"Asistente, host y agente no son sinónimos",body:'<div class="grid"><article><h3>Asistente con una herramienta</h3><p>Recibe intención, pide una tool y presenta el resultado. Puede ser un flujo de un solo paso controlado por la aplicación.</p></article><article><h3>Agente con ciclo de herramientas</h3><p>Puede iterar entre inferencias y herramientas según una política y límites definidos por el host.</p></article></div><div class="call" style="margin-top:14px">No todo chat es un agente autónomo; autonomía significa más decisiones, no más permisos.</div>',notes:""},
{block:"12–32 min · fundamentos IA",title:"RAG recupera contexto; una tool consulta o actúa",body:'<div class="grid three"><article><h3>RAG · generación aumentada por recuperación</h3><p>Recupera contenido, por ejemplo condiciones de devolución, y lo aporta como contexto.</p></article><article><h3>Tool de consulta</h3><p>Lee un dato dinámico del sistema, como el estado actual de un pedido.</p></article><article><h3>Tool de acción</h3><p>Solicita una operación de negocio que debe autorizarse y controlarse.</p></article></div><div class="call" style="margin-top:14px">Son capacidades combinables, pero resuelven problemas distintos. Hoy no implementamos embeddings ni RAG.</div>',notes:""},
{block:"12–32 min · fundamentos IA",title:"Objetivo observable de la clase",body:'<div class="flow"><b>Explicar</b><i>→</i><b>Comparar</b><i>→</i><b>Descubrir</b><i>→</i><b>Controlar</b><i>→</i><b>Auditar</b></div><ul><li>Nombrar los participantes y límites.</li><li>Invocar <code>consultar_estado_pedido</code> y leer su salida mínima.</li><li>Explicar por qué una confirmación necesita control adicional.</li></ul>',notes:""},
{block:"32–47 min · integraciones y MCP",title:"La misma operación, tres integraciones",body:'<table><tr><th>Camino</th><th>Quién conecta con la API</th><th>Intercambio de capacidades</th></tr><tr><td>1 · Cliente HTTP</td><td>Cliente de negocio</td><td>Contrato particular</td></tr><tr><td>2 · Función propia + modelo</td><td>Host ejecuta código específico</td><td>Definición propietaria para ese host</td></tr><tr><td>3 · Cliente MCP + modelo</td><td>Servidor MCP adapta a API</td><td>Descubrir e invocar tools/resources</td></tr></table><div class="call">MCP suma un protocolo de interacción; la API y HTTP siguen resolviendo el acceso al negocio.</div>',notes:""},
{block:"32–47 min · integraciones y MCP",title:"¿Qué problema intenta resolver MCP?",body:'<div class="grid"><article><h3>Sin un protocolo común</h3><p>Cada host y cada proveedor de capacidades puede requerir una integración particular.</p></article><article><h3>Con MCP · Model Context Protocol</h3><p>Cliente y servidor acuerdan cómo descubrir e invocar capacidades con mensajes estructurados.</p></article></div><div class="call" style="margin-top:15px">MCP estandariza interacción con capacidades; no define por sí solo identidad, permisos de negocio ni confianza.</div>',notes:""},
{block:"32–47 min · integraciones y MCP",title:"El sistema acumulativo: MCP se agrega, no borra",body:'<div class="flow"><b>Operador</b><i>→</i><b>Host<br>chat + política</b><i>⇄</i><b>Cliente MCP</b><i>⇄</i><b>Servidor MCP</b><i>→</i><b>API</b></div><div class="flow"><b>API</b><i>→</i><b>MongoDB</b><i>·</i><b>RabbitMQ</b><i>→</i><b>Worker</b></div><div class="call">Se reutilizan API, OAuth, persistencia, eventos y observabilidad. La nueva capa traduce capacidades; no altera las reglas de negocio.</div>',notes:""},
{block:"32–47 min · integraciones y MCP",title:"Quién hace qué en MCP",body:'<div class="grid three"><article><h3>Host</h3><p>Aplicación interactiva. Conserva política, contexto y aprobación.</p></article><article><h3>Cliente MCP</h3><p>Vive dentro del host; negocia e intercambia mensajes con un servidor.</p></article><article><h3>Servidor MCP</h3><p>Expone capacidades acotadas y adapta la operación al servicio real.</p></article></div><p style="margin-top:15px">El transporte lleva mensajes entre cliente y servidor. En el laboratorio se usa <code>stdio</code> local: stdout queda reservado al protocolo.</p>',notes:""},
{block:"32–47 min · integraciones y MCP",title:"Tools y resources ofrecen capacidades distintas",body:'<div class="grid"><article><h3>Tool · operación invocable</h3><p><code>consultar_estado_pedido({ pedidoId })</code></p><p>Consulta datos actuales mediante entrada estructurada.</p><p><code>listar_pedidos_pendientes()</code> devuelve hasta 10 pendientes (ID y estado) sin modificar nada.</p></article><article><h3>Resource · contenido seleccionable</h3><p><code>iaew://docs/pedidos</code></p><p>Documento estático del flujo; el host decide si lo lee.</p></article></div><div class="call" style="margin-top:14px">El resource no se inyecta solo al contexto ni sustituye una consulta parametrizada.</div>',notes:""},
{block:"32–47 min · integraciones y MCP",title:"El schema limita la forma, no concede permiso",body:'<div class="grid"><article><h3>Entrada de consulta</h3><div class="schema">consultar_estado_pedido({\n  pedidoId: \"24 caracteres hex\"\n})</div></article><article><h3>Salida mínima</h3><div class="schema">{ pedidoId, estado }</div></article></div><div class="call" style="margin-top:13px">Validar sintaxis, recurso existente y permisos en host/API. No entregar email, token ni objeto Pedido completo al modelo.</div>',notes:""},
{block:"47–62 min · demo y controles",title:"Una consulta, paso a paso",body:'<div class="steps"><div><b>1</b>Operador pide: «Consultá el pedido …»</div><div><b>2</b>Modelo propone <code>consultar_estado_pedido</code> con el ID dado.</div><div><b>3</b>Host valida forma y límites; cliente invoca MCP.</div><div><b>4</b>Servidor consulta API autorizada y proyecta <code>pedidoId, estado</code>.</div><div><b>5</b>Modelo responde usando el resultado; el host conserva correlación.</div></div>',notes:""},
{block:"47–62 min · demo y controles",title:"Confirmar requiere más que una tool",body:'<div class="flow"><b>Modelo propone</b><i>→</i><b>Host valida</b><i>→</i><b>Operador aprueba</b><i>→</i><b>API autoriza</b><i>→</i><b>Resultado</b></div><div class="grid"><article><h3>Permiso de API</h3><p>Token M2M fuera del modelo; scope de confirmación comprobado por la API.</p></article><article><h3>Aprobación vinculada</h3><p>Se ata a pedido y operación; la clave de idempotencia la mantiene el host.</p></article></div>',notes:""},
{block:"47–62 min · demo y controles",title:"La entrada también puede ser hostil",body:'<div class="grid three"><article><h3>Argumentos</h3><p>Validar tipo, forma, tamaño e identificador existente.</p></article><article><h3>Instrucciones dentro de datos</h3><p>Un texto recuperado no cambia la política ni otorga herramientas.</p></article><article><h3>Herramientas inesperadas</h3><p>Denegar herramientas y destinos arbitrarios; no ejecutar shell ni SQL.</p></article></div><div class="call" style="margin-top:13px">Una instrucción del usuario o del documento no puede elevar scopes ni fabricar aprobación.</div>',notes:""},
{block:"47–62 min · demo y controles",title:"Auditar sin filtrar secretos",body:'<div class="grid"><article><h3>Registrar</h3><p><code>correlationId</code>, nombre de tool, operación, resultado seguro y duración.</p></article><article><h3>No registrar / exponer al modelo</h3><p>Tokens, claves, cuerpos HTTP crudos, stack traces, email ni objeto completo.</p></article></div><div class="call" style="margin-top:14px">La correlación enlaza la operación nueva con la API sin transformar el log en una copia de la base.</div>',notes:""},
{block:"47–62 min · demo y controles",title:"Evidencia docente disponible y límites",body:'<div class="grid"><article><h3>Probado por separado</h3><p>MCP real con API y fixture local; Auth0 real con consulta, aprobación automatizada, confirmación, idempotencia y worker.</p></article><article><h3>Comprobado al revalidar credencial</h3><p>JWT válido sin scopes: HTTP 403 y error MCP <code>HTTP_403</code>; rechazo sin mutación.</p></article></div><div class="call" style="margin-top:13px">No presentar esas corridas separadas como un ciclo único modelo + MCP + Auth0; UI humana real también queda pendiente.</div>',notes:""},
{block:"62–107 min · práctica individual",title:"Práctica: consulta primero, acción controlada después",body:'<table><tr><th>Min</th><th>Actividad</th><th>Evidencia</th></tr><tr><td>0–5</td><td>Preflight del modelo, servicios y token</td><td>Entorno y consulta HTTP</td></tr><tr><td>5–15</td><td>Completar consulta, descubrir tool y comparar MCP/HTTP</td><td>Entrada y salida mínimas</td></tr><tr><td>15–25</td><td>Recorrer el ciclo; aclarar si falta ID</td><td>Quién propone y valida</td></tr><tr><td>25–40</td><td>Rechazar, aprobar y repetir</td><td>Sin mutación; aprobación; replay</td></tr><tr><td>40–45</td><td>Guardar evidencia y explicar MCP</td><td>Respuesta técnica individual</td></tr></table>',notes:""},
{block:"62–107 min · práctica individual",title:"Un único recorrido completo con modelo local",body:'<div class="flow"><b>Chat web</b><i>→</i><b>Host + Ollama</b><i>→</i><b>Cliente / servidor MCP</b><i>→</i><b>API real</b></div><div class="grid"><article><h3>Antes de empezar</h3><p>Ollama y llama3.2:3b preparados; preflight aprobado, API y credenciales disponibles. El chat muestra Modelo local.</p></article><article><h3>Durante la actividad</h3><p>Completar los tres fragmentos; consultar; observar la propuesta; rechazar; solicitar otra confirmación, aprobar y repetir con la clave original.</p></article></div><div class="call" style="margin-top:14px">La actividad requiere inferencia real. Si falla una dependencia, corregirla antes de continuar el mismo recorrido.</div>',notes:""},
{block:"107–115 min · evidencias y próxima clase",title:"¿Qué demuestra cada evidencia?",body:'<div class="grid three"><article><h3>Protocolo</h3><p>Descubrimiento, invocación, salida y lectura de resource.</p></article><article><h3>Control</h3><p>Rechazo sin mutación, aprobación y repetición idempotente.</p></article><article><h3>Integración</h3><p>Correlación entre llamada MCP y resultado API, sin secretos.</p></article></div><div class="call" style="margin-top:14px">La evidencia conecta propuesta del modelo, validación del host, llamada MCP y resultado de la API.</div>',notes:""},
{block:"115–120 min · profundización opcional",title:"Cinco minutos para elegir una ruta",body:'<div class="grid three"><article><h3>RAG práctico</h3><p>Prerrequisito: búsqueda y recuperación de documentos. Dificultad media; puede tener costo según proveedor/infraestructura. Proyecto: buscar políticas y manuales.</p></article><article><h3>Evaluación adversarial</h3><p>Prerrequisito: casos de prueba y límites de herramientas. Dificultad media–alta; costo de inferencias variable. Proyecto: matriz de ataques y controles.</p></article><article><h3>MCP remoto</h3><p>Prerrequisito: transporte, identidad de servicio y despliegue. Dificultad alta; costo de operación/hosting. Proyecto: integrar un servicio compartido.</p></article></div>',notes:""},
{block:"115–120 min · cierre",title:"La intención propone; el sistema decide",body:'<div class="flow"><b>Modelo<br>propone</b><i>→</i><b>Host<br>valida</b><i>→</i><b>Persona<br>aprueba</b><i>→</i><b>API<br>autoriza y ejecuta</b><i>→</i><b>Observabilidad<br>deja evidencia</b></div><div class="call">MCP hace interoperable el intercambio de capacidades. La seguridad sigue siendo una propiedad del sistema completo.</div>',notes:""}
];
slides[14]={...slides[14],body:'<div class="grid"><article><h3>Model Context Protocol (MCP)</h3><p>Un protocolo abierto que estandariza cómo una aplicación host descubre y solicita capacidades publicadas por servidores MCP.</p></article><article><h3>La necesidad</h3><p>Sin un contrato compartido, cada host y cada proveedor integra herramientas con adaptadores particulares.</p></article></div><div class="call" style="margin-top:14px">MCP describe el intercambio de capacidades —por ejemplo, tools y resources—; no es un modelo de IA, no sustituye la API y no concede permisos.</div>',notes:""};
slides[15]={...slides[15],title:"Arquitectura: dónde viven el modelo y MCP",body:`
<svg class="architecture" viewBox="0 0 1120 420" role="img" aria-label="Una persona conversa con una aplicación host que contiene el modelo y el cliente MCP. Este se comunica con un servidor MCP, que llama por HTTP a la API de pedidos.">

  <desc>La interfaz entrega el contexto al modelo; el modelo propone una tool; la política del host valida y decide; el cliente MCP invoca el servidor; el servidor llama a la API. La API autentica, autoriza y aplica las reglas del negocio.</desc>

slides[16]={...slides[16],compact:true,title:"¿Quién consume MCP y cómo lo usa?",body:'<div class="grid three"><article><h3>Chat o asistente</h3><p>La persona escribe una intención en la interfaz del host; el host administra contexto y permisos.</p></article><article><h3>IDE o agente de desarrollo</h3><p>El host incorpora un cliente MCP para descubrir e invocar capacidades aprobadas.</p></article><article><h3>Aplicación propia</h3><p>Puede consumir el mismo servidor MCP desde otra experiencia, si es compatible y está autorizada.</p></article></div><div class="flow" style="margin-top:12px"><b>Persona<br>conversa</b><i>→</i><b>Host<br>incluye cliente MCP</b><i>⇄</i><b>Servidor<br>publica capacidades</b></div><div class="call">El host consume MCP mediante su cliente. La persona conversa con el host; el modelo propone, no invoca ni recibe credenciales.</div>',notes:""};
slides[19]={...slides[19],compact:true,title:"Ponerlo en práctica: del chat a la API",body:'<div class="grid three"><article><h3>1 · La persona pide</h3><p>«Consultá el pedido…» desde el chat del host.</p></article><article><h3>2 · El modelo propone</h3><p>Tool y argumentos estructurados; todavía no hay consulta ni permiso.</p></article><article><h3>3 · El host controla</h3><p>Valida tool, schema, ID y política; pide aprobación para mutaciones.</p></article><article><h3>4 · El cliente MCP envía</h3><p>Descubre e invoca la capacidad del servidor configurado.</p></article><article><h3>5 · El servidor adapta</h3><p>Valida, minimiza la salida y llama por HTTP a la API autorizada.</p></article><article><h3>6 · La respuesta vuelve</h3><p>API → servidor → host → modelo/UI; se responde con el resultado real.</p></article></div><div class="requirements"><span><strong>Host</strong>interfaz + política + cliente MCP</span><span><strong>Servidor</strong>tool/resource + schema + transporte</span><span><strong>API</strong>disponible + credencial y scopes en servidor</span><span><strong>Modelo</strong>Ollama + llama3.2:3b + tool calling</span></div><p class="practice-note">El modelo no llama a la API directamente; las credenciales se mantienen en procesos de confianza.</p>',notes:""};
slides[21]={...slides[21],title:"Seguridad por límites y controles",body:'<div class="grid three security-grid"><article><h3>1 · Entrada y contexto</h3><p>Tratar mensajes y resources como datos no confiables. Una instrucción adversa no es una política ni un permiso.</p></article><article><h3>2 · Host / cliente</h3><p>Allowlist de tools; validar schema, formato y límites; pedir aclaración si falta el ID; aprobación humana vinculada para confirmar.</p></article><article><h3>3 · Servidor MCP</h3><p>Exponer solo capacidades necesarias. Mantener credenciales fuera del modelo; no aceptar destinos arbitrarios; minimizar datos y acotar tiempo/tamaño.</p></article><article><h3>4 · API de negocio</h3><p>OAuth, scope y reglas se verifican en la API. La aprobación no sustituye permisos ni propiedad del objeto.</p></article><article><h3>5 · Evidencia</h3><p>Correlacionar propuesta, aprobación, tool y resultado; redactar secretos y datos personales de los logs.</p></article></div><div class="call" style="margin-top:12px">Este caso usa un operador M2M y no verifica dueño del pedido. Prompt injection puede influir al modelo: los límites efectivos deben estar fuera de él.</div>',notes:""};

slides[15]={...slides[15],title:"Tres conexiones, tres responsabilidades",body:'<div class="flow"><b>Navegador<br>chat + botones</b><i>WebSocket ⇄</i><b>Host<br>modelo + política<br>cliente MCP</b><i>MCP stdio ⇄</i><b>Servidor MCP</b><i>HTTP/OAuth ⇄</i><b>API de pedidos</b></div><div class="grid three" style="margin-top:20px"><article><h3>WebSocket</h3><p>Mensajes, progreso y aprobación entre interfaz y host. Retoma Clase 04.</p></article><article><h3>MCP</h3><p>Descubrir tools y leer resources; el cliente vive en el host.</p></article><article><h3>API HTTP</h3><p>Identidad, scopes, reglas de negocio y datos actuales.</p></article></div><div class="call" style="margin-top:16px">El navegador no recibe credenciales de negocio. El modelo propone; el backend controla.</div>',notes:""};
slides[23]={...slides[23],title:"Demo web: observar antes de aprobar",body:'<div class="steps"><div><b>1</b>Abrir el chat local y leer explícitamente la documentación.</div><div><b>2</b>Consultar el pedido: propuesta y resultado autoritativo separados.</div><div><b>3</b>Rechazar la confirmación y comprobar que sigue pendiente.</div><div><b>4</b>Aprobar esa operación; observar el estado real y repetir con la clave original.</div></div><div class="call" style="margin-top:16px">El comentario del modelo no sustituye el resultado API. Ante timeout o 503, consultar estado; no repetir automáticamente.</div>',notes:""};
slides[24]={...slides[24],title:"Evidencia real y límites de la demostración",body:'<div class="grid three"><article><h3>Integración</h3><p>WebSocket, host, modelo local, MCP, Auth0 y API se comprueban en el paquete que se entrega.</p></article><article><h3>Controles</h3><p>Sesiones aisladas, rechazo, scopes y replay: distinguir pruebas reales de fixtures.</p></article><article><h3>Límites</h3><p>Un clic automatizado no prueba participación humana ni aprendizaje.</p></article></div><div class="call" style="margin-top:16px">Registro vigente: validacion-web.md. No convertir un resultado de tests en una garantía general.</div>',notes:""};
// Guion literal: solo texto para decir; se aplica después de los ajustes visuales.
const speakerScripts=[
  "Hoy vamos a agregar una nueva forma de usar el sistema que venimos construyendo. El título dice inteligencia artificial aplicada a integraciones y MCP, pero el punto de partida sigue siendo nuestro pedido. Ya sabemos crearlo, guardarlo, proteger sus operaciones, procesar eventos y observar qué ocurrió. Ahora queremos que una persona pueda pedir una consulta o solicitar una confirmación desde un asistente.\n\nLa pregunta no es solamente cómo conectar un modelo. La pregunta es cómo integrarlo sin perder los controles que construimos. Durante la clase vamos a separar cinco responsabilidades: proponer, validar, aprobar, autorizar y ejecutar. Que una respuesta parezca inteligente no significa que una operación esté permitida ni que haya ocurrido. Vamos a seguir el mismo caso de pedidos para ver exactamente dónde interviene cada componente.",
  "Miren el recorrido de izquierda a derecha: un operador se comunica con la API y el pedido queda persistido. Eso ya existe. Si hoy necesitáramos consultar su estado, usaríamos un cliente HTTP, presentaríamos una credencial y leeríamos la respuesta de la API.\n\nAhora imaginen que el operador quiere hacerlo desde un chat. La intención es la misma: consultar un pedido y, si corresponde, solicitar su confirmación. Lo que cambia es la interfaz y la manera de producir una solicitud estructurada. El chat no se convierte por eso en la base de datos ni en el dueño de los permisos.\n\n¿Qué necesitaríamos para que ese asistente ayude sin inventar el estado y sin ejecutar cualquier cosa? Necesitamos darle acceso controlado a capacidades concretas y comprobar el resultado. Antes de construir esa conexión, recuperemos por qué las piezas de las clases anteriores siguen siendo necesarias.",
  "Estas seis tarjetas muestran una cadena de necesidades, no seis temas aislados. En la Clase 02 construimos la API y persistimos pedidos. Cuando los datos empiezan a importar, aparece la pregunta de quién puede operar sobre ellos. Esa necesidad nos llevó a la seguridad de la Clase 03.\n\nDespués incorporamos otros componentes. En la Clase 04 conectamos API, broker y worker para procesar eventos. Eso abrió problemas de fallas y duplicados, que trabajamos con resiliencia e idempotencia en la Clase 05. Para que otro consumidor pudiera integrarse necesitábamos un contrato explícito: ese fue el trabajo de documentación de la Clase 06. Y para contrastar lo esperado con lo ocurrido incorporamos observabilidad en la Clase 07.\n\nHoy aparece otro consumidor posible: una aplicación con un modelo de IA. No empezamos de cero. Ese consumidor necesita contratos, permisos, manejo de fallas y evidencia igual que cualquier otra integración. La diferencia es que ahora un modelo puede proponer qué operación realizar y con qué datos. Esa propuesta puede variar incluso ante solicitudes similares y puede ser incorrecta. Por eso la aplicación debe revisarla antes de ejecutarla.",
  "El diagrama recupera nuestro recorrido conocido: cliente HTTP, API con MongoDB, RabbitMQ y worker. Las flechas muestran participantes diferentes. No representan una única transacción ni una garantía de que todo terminó al mismo tiempo.\n\nSi la API confirma una operación y publica un evento, el procesamiento del worker puede ocurrir después. Una respuesta HTTP exitosa acredita lo que ese endpoint declara haber hecho; no demuestra automáticamente que todos los consumidores ya completaron su trabajo. Para eso necesitamos observar el estado correspondiente.\n\nEsto importa todavía más con un asistente. Si el modelo escribe que todo terminó, esa frase no acelera al worker ni prueba la entrega del evento. Y si la conexión se corta, tampoco sabemos solamente por ese corte si la operación llegó a ejecutarse. Por eso mantenemos la idempotencia, los límites de tiempo y la consulta posterior de estado. La IA se incorpora al sistema; las fallas distribuidas siguen existiendo.",
  "Las dos columnas separan lo que debería ocurrir de lo que efectivamente ocurrió. A la izquierda está la documentación: OpenAPI describe las operaciones HTTP; el contrato del evento y las decisiones de arquitectura explican cómo deberían integrarse los componentes. A la derecha está la observabilidad: logs, métricas y trazas permiten investigar la ejecución real.\n\nLa evidencia indicada abajo corresponde a la validación docente registrada de Clase 07: una traza compartida entre API y worker y logs recuperados mediante trace_id. La menciono como antecedente comprobado, no como una ejecución que estemos realizando ahora.\n\nCuando agreguemos el host y el servidor MCP vamos a necesitar la misma separación. Una descripción de herramienta dice qué se puede solicitar. Un registro de ejecución ayuda a comprobar qué se solicitó y qué respondió la API. Ni el contrato por sí solo ni una frase del modelo sustituyen esa evidencia. Esta diferencia nos prepara para la pregunta central: quién decide cada paso.",
  "Las tres tarjetas ordenan el problema. Ya tenemos API, identidad, contratos, eventos y observabilidad. Nos falta traducir una intención del operador a una operación estructurada. Pero esa traducción no puede apropiarse de los permisos.\n\nPensemos en una frase: quiero confirmar este pedido. ¿Quién propone qué llamada hacer? Puede proponerla el modelo. ¿Quién comprueba que la herramienta y sus argumentos sean admisibles? El host y el servidor, cada uno en su frontera. ¿Quién aprueba la acción concreta? La persona, cuando la política exige esa aprobación. ¿Quién verifica el permiso y las reglas de negocio? La API.\n\nPor eso el recuadro dice que el lenguaje natural no concede permisos. La aprobación de una persona tampoco reemplaza la autorización de la API. Y MCP no hace desaparecer esa API. Al terminar la clase quiero que puedan ubicar estas responsabilidades y explicar por qué una operación se ejecutó o fue bloqueada.",
  "Esta tabla es el recorrido de las dos horas. Primero conectamos la clase con lo anterior. Después vamos a definir modelo, contexto y herramientas sin dar por sentado que ya conocen IA. Recién entonces comparamos formas de integración y presentamos MCP.\n\nLa demostración de quince minutos reúne el flujo y los controles. La práctica ocupa cuarenta y cinco minutos y es individual. Usamos una interfaz y un host preparados; ustedes completan tres fragmentos del servidor MCP con el código de la guía, comprueban que la suite pase y entregan un zip con evidencia. No vamos a construir un chatbot entero ni instalar toda la infraestructura durante ese tiempo. La descarga del modelo y la preparación del entorno son previas.\n\nEl preflight del modelo local debe aprobarse antes de iniciar. Si hay un problema de entorno, lo resolvemos antes de continuar con el mismo recorrido completo. Los últimos minutos conectan las evidencias con testing y ofrecen rutas opcionales de profundización.",
  "Miren las tres tarjetas: modelo, inferencia y contexto. Un modelo de lenguaje, o LLM, es un sistema con parámetros aprendidos que genera una continuación a partir de una entrada. No necesitamos estudiar hoy su entrenamiento, pero sí entender qué recibimos al usarlo: una salida generada, no una certificación de verdad.\n\nInferencia es la ejecución del modelo para producir esa salida. Contexto es la información disponible durante esa ejecución: instrucciones, mensajes y datos que la aplicación le haya proporcionado. Ese contexto tiene un límite; no equivale a acceso permanente a todos nuestros sistemas.\n\nPor ejemplo, un pedido creado hace un minuto no aparece mágicamente en lo que el modelo aprendió. Para responder sobre ese pedido necesita información actual obtenida por una integración autorizada. Aunque el modelo escriba con mucha seguridad, puede interpretar mal una pregunta o completar un dato inexistente.\n\n¿De dónde debería salir entonces el estado del pedido? De la API que lo conserva. El modelo puede ayudarnos a formular la consulta y a explicar el resultado, pero no reemplaza la fuente del dato.",
  "La columna izquierda presenta una frase plausible: el pedido probablemente está pendiente. Puede sonar razonable, pero sin consultar el sistema es una conjetura. No tenemos evidencia de que ese pedido exista ni de que conserve ese estado.\n\nA la derecha aparece una operación concreta y una salida mínima: identificador y estado. Si esa salida proviene de una llamada autorizada a nuestra API, contamos con un dato del sistema en ese momento. Sigue siendo importante saber qué consultamos, con qué identidad y cuándo.\n\nLa distinción también se mantiene después de la consulta. El modelo podría recibir un resultado correcto y redactarlo mal. Por eso nuestro chat muestra una tarjeta de resultado autoritativo separada del comentario opcional del asistente. Si el comentario contradice la tarjeta, no elegimos la frase más convincente: verificamos la operación en la API.\n\nNecesitamos ahora una forma de pasar de la intención a esa llamada estructurada. Esa capacidad se llama tool calling.",
  "Los cuatro pasos muestran el ciclo de tool calling. Una tool es una herramienta invocable con una entrada definida. La aplicación le describe al modelo las herramientas disponibles y sus schemas, es decir, la forma esperada de los argumentos. El modelo puede responder con un nombre de herramienta y esos argumentos.\n\nHasta ahí todavía no ocurrió la consulta. La propuesta es una salida estructurada. El modelo no ejecuta JavaScript ni abre una conexión HTTP por el solo hecho de escribir el nombre de una función. El host recibe esa propuesta, verifica que la herramienta esté permitida y que los argumentos correspondan a la intención, y aplica la política de ejecución.\n\nSi pasa los controles, la aplicación realiza la llamada mediante su cliente de integración. Después puede devolver el resultado acotado al modelo para generar una explicación. También puede rechazar la propuesta o pedir aclaración.\n\nEsta separación es nuestra primera barrera importante: producir una propuesta y tener autoridad para ejecutarla son cosas distintas. Tool calling tampoco implica necesariamente usar MCP; podemos conectar una función propia directamente.",
  "Las dos columnas comparan cuánto decide la aplicación durante un flujo. A la izquierda, un asistente recibe una intención, propone una herramienta y presenta el resultado dentro de un recorrido acotado. A la derecha, un agente puede repetir ciclos de inferencia y herramientas para resolver una tarea.\n\nLa palabra agente se usa de maneras diferentes, por eso hoy nos interesa describir el comportamiento concreto. ¿Cuántas decisiones puede tomar? ¿Qué herramientas tiene? ¿Cuándo debe detenerse? ¿Qué necesita aprobación? Esas preguntas son más útiles que la etiqueta.\n\nNuestro laboratorio no entrega autonomía ilimitada. La entrada admite solicitudes acotadas y el host comprueba la propuesta. Hay límites de tiempo, tamaño y llamadas. Si falta el identificador, pedimos aclaración; no dejamos que el modelo lo invente.\n\nEl recuadro resume la diferencia: más autonomía puede significar más decisiones dentro del flujo, pero nunca permisos nuevos por sí misma. Los permisos siguen siendo una decisión externa al modelo.",
  "Las tres tarjetas distinguen problemas que suelen mezclarse. RAG significa generación aumentada por recuperación. Consiste en recuperar contenido relevante y aportarlo al contexto para generar una respuesta. Un ejemplo es buscar la política de devoluciones en documentos. La recuperación puede usar búsqueda por palabras o métodos semánticos; no exige siempre embeddings ni una base vectorial.\n\nLa segunda tarjeta habla de consultar un dato dinámico, como el estado de un pedido. La tercera habla de realizar una acción de negocio, como confirmarlo. En ambos casos necesitamos una integración con el sistema responsable y sus controles. Una tool puede servir para recuperar documentos o para consultar una API; las categorías pueden combinarse.\n\nLo que no debemos hacer es tratar un documento recuperado como prueba del estado actual de un pedido, ni como permiso para modificarlo. Tampoco necesitamos implementar RAG para usar MCP. Hoy no construiremos recuperación documental: usamos estas diferencias para elegir la integración adecuada y evitar agregar componentes que el problema no necesita.",
  "La secuencia de la pantalla resume lo que vamos a demostrar: explicar participantes, comparar alternativas, descubrir capacidades, controlar operaciones y auditar resultados. No alcanza con que el chat produzca una frase. Tenemos que poder reconstruir cómo llegó a ella.\n\nHagamos una clasificación breve antes de avanzar. Escuchen cuatro ejemplos. Primero: el pedido seguramente está pendiente. Segundo: la API devolvió un identificador y estado pendiente. Tercero: el modelo propuso confirmar_pedido con un identificador. Cuarto: el operador aprobó la solicitud, la API comprobó el scope y respondió confirmado.\n\nClasifiquen cada ejemplo como texto generado, dato consultado, propuesta de herramienta u operación autorizada. Anoten quién produjo la evidencia y qué falta para pasar al paso siguiente. Pueden contrastar su respuesta con la persona de al lado; la evidencia de la práctica seguirá siendo individual.\n\nLa primera frase es texto generado, sin respaldo por sí sola. La segunda es un dato consultado. La tercera todavía es una propuesta; no demuestra ejecución. La cuarta describe autorización y ejecución, que debemos contrastar con el resultado de la API. Esta distinción nos permite comparar ahora tres maneras de conectar el mismo sistema.",
  "Las tres filas resuelven la misma operación de negocio. En la primera, un cliente HTTP conoce el endpoint y consume la API directamente. Ese cliente puede ser una aplicación tradicional sin modelo.\n\nEn la segunda, una aplicación con modelo define una función propia. El host recibe la propuesta de esa función, aplica controles y ejecuta código que llama a la API. Es una opción válida; para un único flujo pequeño puede ser la alternativa más simple. La definición y el adaptador quedan ligados a esa aplicación.\n\nEn la tercera, el host incorpora un cliente MCP y descubre capacidades de un servidor MCP. Ese servidor adapta la herramienta a nuestra API. Aparece un contrato compartido para descubrir y solicitar capacidades, pero HTTP y las reglas de negocio siguen presentes.\n\nNo estamos ordenando estas filas de peor a mejor. Elegimos según la necesidad. MCP puede aportar cuando queremos reutilizar capacidades entre hosts compatibles; también agrega una capa, configuración y puntos de falla. No hace falta MCP para construir cualquier chatbot. Veamos qué parte intenta estandarizar.",
  "MCP significa Model Context Protocol. En la tarjeta izquierda está su función: ofrecer un protocolo abierto para que una aplicación host descubra y solicite capacidades publicadas por un servidor. En la derecha está la necesidad que lo motiva: evitar que cada combinación de host y proveedor tenga que inventar todo el intercambio desde cero.\n\nPiensen en lo que ya conocemos sobre contratos de integración. Compartir un contrato reduce diferencias en cómo se describe una capacidad y cómo se solicita. No elimina el trabajo de adaptar esa capacidad a cada sistema de negocio. Nuestro servidor todavía debe saber cómo consultar pedidos y cómo manejar errores.\n\nTampoco estamos descargando un modelo al instalar MCP. El protocolo no es una IA ni una base de datos. No otorga permisos ni garantiza que cualquier cliente sea compatible con cualquier servidor y versión. Hay que verificar transporte, capacidades y configuración.\n\nEn nuestro caso, MCP organiza el intercambio entre host y servidor. Para verlo sin mezclarlo con el chat o la API, separemos las tres conexiones del laboratorio.",
  "Recorramos el diagrama de izquierda a derecha. El navegador contiene el chat y los botones. Se comunica con el host mediante WebSocket: esa conexión lleva mensajes, progreso y decisiones de aprobación. Retomamos la comunicación bidireccional de Clase 04. WebSocket es una elección de nuestra interfaz, no una condición universal para integrar IA.\n\nEn el bloque central, el host coordina el uso del modelo, aplica política e incluye un cliente MCP. El modelo se ejecuta mediante Ollama en el backend; no está corriendo dentro de la página. El cliente MCP se comunica con el servidor MCP por stdio: entrada y salida estándar de un proceso local. Ahí viaja el protocolo, no los mensajes WebSocket del navegador.\n\nPor último, el servidor MCP llama por HTTP a la API de pedidos y usa OAuth para obtener la credencial correspondiente. La API conserva identidad, scopes y reglas de negocio. El resultado regresa por esas conexiones.\n\nSi pulso Aprobar, el navegador envía una decisión sobre una operación pendiente. El backend valida su vínculo y firma la aprobación. Ese botón no crea permisos de API. Ninguna credencial de negocio se envía al navegador ni al contexto del modelo.",
  "Las tres tarjetas muestran posibles experiencias de uso: un chat, un entorno de desarrollo o una aplicación propia. En todos los casos, quien consume MCP es la aplicación host mediante su cliente MCP. La persona usa una interfaz; no tiene que escribir mensajes del protocolo.\n\nEn el flujo inferior, la persona conversa con el host y el host se conecta al servidor que publica capacidades. El modelo puede recibir descripciones de esas capacidades y proponer una llamada. La ejecución efectiva sigue perteneciendo a la aplicación. Esta distinción evita imaginar que el modelo abre por su cuenta conexiones a cualquier servidor.\n\nOtro host compatible podría reutilizar el mismo servidor de pedidos, pero tendría que estar configurado y autorizado. Compartir el protocolo no significa compartir automáticamente todas las credenciales ni heredar la política de otro host.\n\nEn nuestra práctica, la experiencia es el chat preparado. No estamos integrando ahora un IDE ni desplegando un servicio remoto. Los ejemplos sirven para entender dónde puede ser útil la reutilización y por qué el servidor publica capacidades independientes de una sola pantalla.",
  "Las columnas distinguen dos capacidades. A la izquierda están las tools: operaciones invocables con una entrada definida. Consultar el estado recibe un pedidoId. Listar pendientes no recibe argumentos y devuelve como máximo diez pedidos, con identificador y estado. Son lecturas; no necesitan la aprobación que reservamos para confirmar. Siguen necesitando autorización en la API.\n\nA la derecha aparece un resource, identificado por la URI iaew://docs/pedidos. Es contenido estático sobre el flujo. Esa URI es un identificador del recurso MCP; no es un endpoint HTTP de nuestra API.\n\nEl host decide explícitamente si lee ese resource. En el chat lo hacemos con el botón Leer documentación de pedidos. Su existencia en el servidor no implica que ya esté dentro del contexto del modelo. En este laboratorio la lectura se muestra en la interfaz; no la damos por incorporada automáticamente al modelo.\n\nLa documentación explica cómo funciona el pedido. Para conocer su estado actual necesitamos la tool de consulta. Tener ambas capacidades no las vuelve intercambiables.",
  "En la entrada vemos un identificador con formato definido: veinticuatro caracteres hexadecimales. El schema describe la forma esperada. A la derecha está la salida mínima: identificador y estado. No necesitamos devolver el objeto Pedido completo para responder esta consulta.\n\nPero aceptar la forma no es autorizar el acceso. Un identificador puede estar bien escrito y no existir. Puede existir y corresponder a un objeto que una identidad no debería consultar. Por eso diferenciamos validación sintáctica, búsqueda del pedido y autorización. En este laboratorio el host valida la propuesta, el servidor adapta y comprueba el resultado, y la API aplica sus permisos y reglas.\n\nNuestra identidad es M2M, es decir, de servicio a servicio, con función de operador del laboratorio. No estamos implementando autorización por dueño del pedido. Tener un scope no demuestra que una aplicación multiusuario esté aislando correctamente los objetos de cada persona.\n\nLa salida mínima reduce exposición: no enviamos emails, tokens ni cuerpos completos al modelo. El schema ayuda a mantener un contrato, pero necesita políticas y controles de negocio fuera de él.",
  "Las seis tarjetas cuentan el ciclo completo. Primero la persona escribe una solicitud en el chat. En nuestro laboratorio la gramática es acotada: consulta o confirmar, seguido del identificador. No estamos prometiendo comprensión de lenguaje natural irrestricto.\n\nSegundo, el modelo recibe las descripciones y propone nombre de tool y argumentos. Tercero, el host contrasta la propuesta con la intención, valida identificador y política y pide aprobación si es una mutación. Cuarto, su cliente MCP invoca la capacidad configurada. Quinto, el servidor adapta esa llamada a la API, que verifica permisos y negocio. Sexto, el resultado vuelve al host; se muestra como dato autoritativo y puede acompañarse con un comentario del modelo.\n\nLas cuatro cajas inferiores son requisitos que tenemos que comprobar: host con interfaz y política; servidor con tools, schemas y transporte compatible; API disponible con credenciales autorizadas; y Ollama con llama3.2:3b y tool calling comprobado. La descarga previa y el preflight reducen problemas durante la práctica.",
  "Sigamos las cinco estaciones de la flecha. El modelo propone confirmar, el host valida, el operador aprueba, la API autoriza y recién entonces obtenemos un resultado. Cada paso responde una pregunta diferente.\n\nEl permiso de API proviene de una identidad M2M y de sus scopes. La credencial se mantiene fuera del modelo. La aprobación, en cambio, expresa que la persona acepta esa acción concreta sobre ese pedido en ese momento. En nuestro host queda vinculada a la operación y se firma; no aceptamos simplemente un booleano generado por el modelo.\n\nSi rechazo, no debería despacharse la mutación. Si después cambio de opinión, tengo que solicitar una nueva confirmación y revisar su nuevo panel. El rechazo anterior no deja una aprobación pendiente.\n\nLa clave de idempotencia también la genera y conserva el host. Permite repetir la misma operación sin solicitar un segundo efecto, dentro del contrato de la API. No la elige el modelo y no convierte cualquier nueva confirmación en la misma operación. Ahora ubiquemos estos controles en cada frontera de confianza.",
  "Las cinco tarjetas muestran dónde se hace cumplir cada control. En entrada y contexto, tratamos mensajes y contenido externo como datos no confiables. Una prompt injection es un intento de introducir instrucciones que desvíen el comportamiento del modelo. Puede llegar directamente en un mensaje o indirectamente en un documento. Leer ese texto no lo convierte en política.\n\nEn el host restringimos las tools permitidas, validamos argumentos, pedimos aclaración cuando falta el ID y exigimos aprobación vinculada para confirmar. En el servidor MCP mantenemos las credenciales fuera del contexto, evitamos destinos arbitrarios y limitamos tiempo, tamaño y datos devueltos.\n\nEn la API se verifican OAuth, scopes y reglas de negocio. La aprobación del chat no permite saltar esos controles. Si el caso fuera multiusuario también necesitaríamos autorización por objeto; nuestro operador M2M no la implementa.\n\nFinalmente, la evidencia debe permitir reconstruir el recorrido sin filtrar secretos. No prometemos inmunidad general frente a toda inyección. Lo que hacemos es limitar el impacto: aunque el texto influya al modelo, no debería poder ampliar por sí mismo herramientas, destinos o permisos. Los controles efectivos tienen que estar fuera del modelo.",
  "La columna izquierda enumera lo que sí nos ayuda a investigar: correlationId, nombre de herramienta, operación, resultado seguro y duración. La derecha enumera lo que no necesitamos copiar: tokens, claves, cuerpos HTTP completos, trazas de error internas, emails ni el objeto de negocio entero.\n\nRecuperamos el principio de Clase 07: correlacionar señales para reconstruir un recorrido. En esta integración buscamos el mismo correlationId en los eventos host.tool y mcp.api. Eso permite relacionar una solicitud del host con la llamada del adaptador y su resultado sin convertir el log en una copia de la base.\n\nCorrelationId no es una credencial ni la clave de idempotencia. Uno sirve para seguir el recorrido; la otra identifica una operación a efectos de repetición. Tampoco basta encontrar un log que diga enviado para afirmar que la API confirmó. Tenemos que leer qué etapa y resultado representa cada registro.\n\nCuando guarden evidencia, conserven esos campos mínimos y el estado observado. No incluyan archivos de configuración ni capturas que expongan secretos.",
  "Vamos a recorrer los cuatro pasos de la pantalla en el chat local. Primero verifico que el chat muestre Modelo local y que Ollama esté disponible. Abro Leer documentación de pedidos. Esa acción lee explícitamente el resource; no es una consulta del estado del pedido.\n\nAhora consulto un pedido de prueba con consulta y su identificador. Observen la propuesta y la tarjeta autoritativa. Si aparece un comentario del modelo, lo leemos por separado: lo que acredita el estado es el resultado de la operación, contrastado con la API.\n\nSolicito confirmar el mismo pedido. Reviso la acción y el identificador y pulso Rechazar. Después vuelvo a consultar: necesitamos comprobar que sigue pendiente. Para el cuarto paso solicito otra vez confirmar, reviso el nuevo panel y apruebo antes de que venza. La solicitud rechazada ya terminó; no reutilizo ese pendiente.\n\nDespués de una confirmación exitosa, pulso Repetir operación con la clave original dentro de su vigencia de ciento veinte segundos. Espero el marcador de repetición y el mismo estado confirmado. Escribir otra vez confirmar crea otra operación. Si hay timeout, desconexión o un resultado incierto, consulto estado y registro la incertidumbre; no reenvío automáticamente la acción.",
  "Las tres columnas nos obligan a precisar qué está comprobado. La primera reúne el recorrido real: WebSocket, host, modelo local, MCP, Auth0 y API. En el paquete docente se registraron once comprobaciones exitosas de integración. La segunda reúne controles, como rechazo, scopes y replay, que también tienen pruebas específicas y fixtures.\n\nUna fixture es un entorno o dato controlado para ejercitar un caso. Sirve, por ejemplo, para producir un error de manera repetible. No prueba por sí sola que un servicio externo real se comporte igual. Por eso el registro separa esas pruebas de la ejecución con Auth0 y API reales.\n\nLa tercera columna pone el límite humano: los clics de esa validación fueron automatizados. No acreditan una persona aprobando ni que un alumno comprendió el flujo. Tampoco se registró todavía un ensayo hablado de quince minutos con una persona.\n\nEn validacion-web.md pueden ver el alcance y las latencias observadas. Son muestras del equipo docente, no garantías para todos los equipos. Que pase una suite es evidencia concreta dentro de un alcance; no es una garantía general de seguridad o aprendizaje.",
  "Ahora empieza la práctica individual de cuarenta y cinco minutos. La flecha muestra un único recorrido: chat web, host con Ollama, cliente y servidor MCP y API real. Todos usamos llama3.2:3b y el chat debe indicar Modelo local. Las dos tarjetas separan la preparación previa de lo que hacemos durante la actividad; no son caminos alternativos.\n\nAntes de iniciar necesitamos el modelo descargado, el preflight aprobado, la API disponible y las credenciales configuradas. Si falla una dependencia, registramos el error y la corregimos con el docente antes de reanudar. Usar llamadas programadas sin inferencia no completa esta actividad. Si el equipo no tiene recursos suficientes, necesitamos un equipo preparado con el mismo modelo y recorrido, manteniendo la evidencia individual.\n\nEl frontend, el host, la aprobación y la acción de confirmación ya están preparados. Ustedes completan tres fragmentos de servidor-mcp/server.js: proyectar la consulta, proyectar el listado de pendientes y registrar la tool del listado. La actividad incluye el código y la explicación de cada paso. Antes de resolverlos se esperan seis fallas; después deben pasar las veintinueve pruebas. Después inicien el host y abran el navegador. Si editan el servidor con el host abierto, deben reiniciarlo y recargar la página: los tests no recargan el proceso MCP.\n\nSigan los tiempos de la actividad: cinco minutos de preflight, diez para descubrir y consultar, diez para observar la propuesta del modelo y su validación, quince para rechazar, solicitar de nuevo, aprobar y repetir, y cinco para guardar la explicación. Completen el mapa de responsabilidades mientras trabajan. Al terminar entregan el ZIP del proyecto funcionando con la evidencia indicada en la actividad, incluida la propuesta del modelo, las validaciones y los responsables de cada paso. No compartan tokens ni archivos de entorno.",
  "Las tres tarjetas ordenan el cierre de la práctica. En protocolo, necesitamos evidencia de descubrimiento, invocación, salida mínima y lectura explícita del resource. Para acreditar la actividad completa, además mostramos la propuesta producida por el modelo y la validación que realizó el host.\n\nEn control, necesitamos rechazo sin mutación, aprobación vinculada y repetición con la clave original. Una captura del botón Aprobar no basta; hay que contrastar el estado antes y después. Y una repetición exitosa en este caso no demuestra entrega exactamente una vez bajo toda falla o concurrencia.\n\nEn integración, relacionamos la llamada con la API usando correlación y un resultado seguro. Un 403 de una fixture demuestra el caso de esa prueba; para hablar de Auth0 real necesitamos la ejecución real correspondiente.\n\nRevisen su nota: ¿pueden ubicar cada componente y conexión? ¿Explican qué controles están fuera del modelo? ¿Distinguen lo observado de lo supuesto? Si un punto no se pudo ejecutar, escríbanlo; no lo completen con una afirmación del asistente.\n\nEsta forma de definir entradas, resultados, errores y evidencia nos lleva a testing de integración y contratos. La actividad sigue siendo individual. Nos quedan las rutas para quien quiera profundizar después.",
  "Estas tres rutas son opcionales. Son propuestas para investigar después de completar la actividad. La primera es RAG práctico: buscar políticas o manuales y usar los fragmentos recuperados para responder. El prerrequisito es entender búsqueda y recuperación de documentos. Podemos empezar con búsqueda lexical y después evaluar técnicas semánticas; embeddings no son una obligación universal.\n\nLa segunda es evaluación adversarial: construir una matriz de entradas problemáticas y comprobar qué límites se mantienen. Requiere casos de prueba claros y conocer las herramientas expuestas. Rechazar unos pocos ataques no permite declarar seguridad general.\n\nLa tercera es MCP remoto: pasar del proceso local a un servicio compartido. Agrega transporte, identidad, despliegue y operación. No alcanza con abrir el puerto del laboratorio; nuestro chat local no fue diseñado como servicio multiusuario.\n\nAntes de elegir, miren dificultad y costos: inferencias, infraestructura y mantenimiento pueden variar según el proveedor y el diseño. Elijan una pregunta concreta para investigar, por ejemplo cómo medir fidelidad de una respuesta o cómo autorizar distintos usuarios. No hace falta implementar las tres rutas.",
  "Volvamos a la pregunta de apertura y recorramos la última flecha. El modelo propone una operación. El host valida esa propuesta y controla el flujo. La persona aprueba cuando la política lo exige. La API autoriza y ejecuta según sus reglas. La observabilidad deja evidencia para contrastar lo ocurrido.\n\nMCP estandariza el intercambio de capacidades entre aplicaciones compatibles. No reemplaza la API, la autorización ni el diseño de la integración. WebSocket resolvió la conversación entre navegador y host; MCP resolvió otro tramo; HTTP y OAuth siguieron presentes en el acceso al negocio.\n\nSi se llevan una idea de esta clase, que sea esta: una intención entendida no equivale a una operación permitida, y una frase generada no equivale a una ejecución comprobada. Integramos IA cuando conectamos esa propuesta con contratos, controles y evidencia. Todo lo que construimos en las clases anteriores sigue haciendo falta. La seguridad continúa siendo una propiedad del sistema completo."
];
slides.forEach((slide,index)=>{slide.notes=speakerScripts[index]});
const deck=document.querySelector("#deck");let current=0;const presenterChannel="BroadcastChannel"in window?new BroadcastChannel("iaew-clase-08-presenter"):null;
function render(){deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme||""} ${s.compact?"compact":""} ${i===current?"active":""}" aria-label="Diapositiva ${i+1}"><p class="kicker">${s.block}</p><h2>${s.title}</h2><div class="slide-content">${s.body}</div><div class="footer"><span>IAEW 2026 · Clase 08 · IA aplicada a integraciones y MCP</span><span class="slide-no">${i+1} / ${slides.length}</span></div></section>`).join("");document.querySelector("#counter").textContent=`${current+1} / ${slides.length}`;document.querySelector("#progress").style.width=`${(current+1)/slides.length*100}%`;publish()}
function publish(){const s=slides[current],message={source:"deck",type:"state",current,total:slides.length,kicker:s.block,title:s.title.replace(/<br\s*\/?>/gi," "),notes:s.notes,nextTitle:slides[current+1]?.title.replace(/<br\s*\/?>/gi," ")||"Fin",sentAt:Date.now()};if(presenterChannel)presenterChannel.postMessage(message);try{localStorage.setItem("iaew-clase-08-presenter-state",JSON.stringify(message))}catch{}}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
document.querySelector("#prev").onclick=()=>go(current-1);document.querySelector("#next").onclick=()=>go(current+1);document.querySelector("#presenter").onclick=()=>window.open("presenter.html","iaew-clase-08-presenter","width=1100,height=820");document.querySelector("#fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(current+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(current-1)}if(e.key.toLowerCase()==="p")window.open("presenter.html","iaew-clase-08-presenter","width=1100,height=820");if(e.key.toLowerCase()==="f")document.querySelector("#fullscreen").click()});
addEventListener("storage",e=>{if(e.key==="iaew-clase-08-presenter-message"&&e.newValue){const msg=JSON.parse(e.newValue);if(msg.type==="navigate")go(msg.index)}});if(presenterChannel)presenterChannel.onmessage=e=>{if(e.data?.source==="presenter"&&e.data.type==="navigate")go(e.data.index);if(e.data?.source==="presenter"&&e.data.type==="state-request")publish()}
render();
</script></body></html>
